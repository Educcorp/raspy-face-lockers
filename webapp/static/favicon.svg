<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo con gradiente (círculo orgánico) -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c1603c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e08a5f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Forma orgánica redondeada (similar a brand-mark) -->
  <ellipse cx="32" cy="32" rx="28" ry="28" fill="url(#gradient)" 
           style="border-radius: 50% 50% 45% 55% / 55% 45% 55% 45%;"/>
  
  <!-- Texto "SL" centrado perfectamente -->
  <text x="32" y="32" font-family="Georgia, serif" font-size="32" font-weight="700" 
        fill="white" text-anchor="middle" dominant-baseline="central">SL</text>
</svg>
