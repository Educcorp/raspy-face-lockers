{% extends "base.html" %}
{% block title %}Iniciar sesión · Smart Locker{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="login-brand">
      <span class="brand-mark">SL</span>
      <h1>Panel Smart Locker</h1>
      <p class="subtitle">Inicia sesión con tu matrícula y PIN</p>
    </div>
    <form method="post">
      <div class="form-row">
        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" name="matricula" required autofocus autocomplete="username">
      </div>
      <div class="form-row">
        <label for="pin">PIN</label>
        <input type="password" id="pin" name="pin" required autocomplete="current-password">
      </div>
      <button class="btn" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
